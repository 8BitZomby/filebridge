name: macOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'mac'
          target: 'desktop'

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy macOS application
        run: |
          macdeployqt build/fb.app

      - name: Package macOS application
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/fb.app FileBridge-macOS.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: FileBridge-macOS
          path: FileBridge-macOS.zip
