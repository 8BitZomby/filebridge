name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item build/Release/fb.exe package/FileBridge.exe
          windeployqt --release --no-translations --compiler-runtime package/FileBridge.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FileBridge-Windows-x64
          path: package/
